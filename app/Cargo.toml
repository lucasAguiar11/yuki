[package]
name = "yuki"
version = "0.8.0"
edition = "2021"
license.workspace = true

[dependencies]
gpui-kit = { version = "0.7", features = ["tree-sitter", "tree-sitter-html", "tree-sitter-graphql", "tree-sitter-markdown"] }
yuki-core = { path = "../crates/yuki-core" }
yuki-mcp = { path = "../crates/yuki-mcp" }
yuki-storage = { path = "../crates/yuki-storage" }
yuki-crypto = { path = "../crates/yuki-crypto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
yuki-oauth = { path = "../crates/yuki-oauth" }
yuki-auth = { path = "../crates/yuki-auth" }
yuki-git = { path = "../crates/yuki-git" }
yuki-import = { path = "../crates/yuki-import" }
yuki-export = { path = "../crates/yuki-export" }
reqwest = { workspace = true }
dirs = "6"
rust-i18n = "4"
sys-locale = "0.3"
# Already in the tree through gpui; compares release tags (update.rs).
semver = "1"
# Already in the tree; splits a pasted cURL (paste_curl.rs).
shlex = "1"
# Already in the tree; binary response bodies: decode, name the file (binary.rs).
base64 = "0.22"
mime_guess = "2"
# Already in the tree through gpui; the frame type of rendered PDF pages (pdf.rs).
image = { version = "0.25", default-features = false }

# Already in the tree through gpui: dock icon (objc2*), PDF pages (core-graphics).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
