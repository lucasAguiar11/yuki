name: release

# Actions → release → Run workflow (on main) with the version: bumps app/Cargo.toml,
# builds, then commits + tags that exact tree and opens a draft release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    # GPUI renders through Metal: macOS is the only target we ship.
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Deploy key: the only push identity a personal-repo ruleset can let bypass `main`.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Bump app version
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "v$VERSION already exists"; exit 1
          fi
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" app/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Also rewrites yuki's entry in Cargo.lock.
      - run: cargo build --release -p yuki --target aarch64-apple-darwin
      - run: cargo build --release -p yuki --target x86_64-apple-darwin

      - name: Third-party licenses
        run: |
          cargo install cargo-about --locked
          cargo about generate about.hbs -o THIRD-PARTY.html

      - name: Bundle Yuki.app
        run: |
          app=Yuki.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          lipo -create -output "$app/Contents/MacOS/yuki" \
            target/aarch64-apple-darwin/release/yuki \
            target/x86_64-apple-darwin/release/yuki
          for s in 16 32 128 256 512; do
            sips -z $s $s app/assets/icon.png --out "icon.iconset/icon_${s}x${s}.png"
            sips -z $((s*2)) $((s*2)) app/assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/yuki.icns"
          cp .github/Info.plist "$app/Contents/Info.plist"
          cp LICENSE NOTICE THIRD-PARTY.html "$app/Contents/Resources/"
          # lipo drops the per-slice signature; arm64 refuses to launch unsigned.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" Yuki-macos-universal.zip

      # Only after a good build, so a failed run leaves no tag behind. If main moved
      # meanwhile the push is rejected (non-fast-forward): rerun.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -qam "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            Yuki-macos-universal.zip
            THIRD-PARTY.html
